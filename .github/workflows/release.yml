name: Release

# Tagging is the trigger, so cutting a release is one `git tag` and a push
# rather than a checklist somebody follows by hand.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, e.g. v1.0.0'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ticktz_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, ldap, mbstring, pdo_mysql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress

      # A release is the worst moment to discover a known vulnerability, and
      # the one moment somebody will definitely be looking at the output.
      - run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ticktz_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --colors=always

      - name: The tag must match the version in the code
        # A container that reports a different version from the tag it was
        # built from is the kind of thing nobody notices until they are trying
        # to work out which build is in production.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CODE="v$(grep -oP "(?<=TICKTZ_VERSION', ')[^']+" config/ticktz.php)"
          echo "tag=${TAG} code=${CODE}"
          test "${TAG}" = "${CODE}"

  image:
    name: Build and publish the image
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3, 1.2, 1 and latest, so an operator can pin as tightly as
          # they want to. `latest` only moves for a real release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # arm64 as well as amd64: a self-hosted service desk lands on an
          # Apple laptop or an Ampere VM as often as on an Intel server.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Draft the release notes
    needs: image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          # Drafted rather than published: the generated notes are a commit
          # list, and a release worth tagging is worth a paragraph written by
          # a person.
          draft: true
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
            ```

            Built for `linux/amd64` and `linux/arm64`.

            ## Upgrading

            See [docs/self-hosting.md](docs/self-hosting.md#upgrading). Take a
            backup first — `scripts/backup.sh` — and read the notes below for
            anything that needs a manual step.
