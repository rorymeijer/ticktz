name: Release

# Tagging is the trigger, so cutting a release is one `git tag` and a push
# rather than a checklist somebody follows by hand.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, e.g. v1.0.0'
        required: true

permissions:
  contents: write # create the release and attach the archive
  packages: write # push the image to ghcr.io
  # Attestations are signed with a short-lived certificate issued to this
  # workflow rather than with a key somebody stores. These two are what let it
  # ask for one. See docs/releasing.md.
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ticktz_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, ldap, mbstring, pdo_mysql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress

      # A release is the worst moment to discover a known vulnerability, and
      # the one moment somebody will definitely be looking at the output.
      - run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ticktz_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --colors=always

      - name: The tag must match the version in the code
        # A container that reports a different version from the tag it was
        # built from is the kind of thing nobody notices until they are trying
        # to work out which build is in production.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CODE="v$(grep -oP "(?<=TICKTZ_VERSION', ')[^']+" config/ticktz.php)"
          echo "tag=${TAG} code=${CODE}"
          test "${TAG}" = "${CODE}"

  image:
    name: Build and publish the image
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3, 1.2, 1 and latest, so an operator can pin as tightly as
          # they want to. `latest` only moves for a real release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # arm64 as well as amd64: a self-hosted service desk lands on an
          # Apple laptop or an Ampere VM as often as on an Intel server.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle:
    name: Build the installable archive
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, ldap, mbstring, pdo_mysql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # A GitHub source archive carries neither `vendor` nor the built assets,
      # so installing one means running composer and npm on the server — with
      # network access to two package registries, at whatever version of each
      # tool happens to be installed. The archive below is the whole
      # application, ready to run, which is what makes an upgrade from the
      # browser a download and a swap rather than a build.
      - name: Install what the application ships with
        run: |
          composer install --no-dev --no-interaction --no-progress \
            --prefer-dist --optimize-autoloader --classmap-authoritative
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble the tree
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          STAGE="dist/ticktz"

          mkdir -p "$STAGE"

          # Named rather than excluded. An exclude list quietly ships whatever
          # somebody adds to the repository next; this one ships what the
          # application is, and anything new has to be added on purpose.
          for path in app bootstrap config database lang public resources routes \
                      scripts vendor artisan composer.json composer.lock LICENSE \
                      README.md CHANGELOG.md docs docker; do
            # An `if`, not `[ … ] && cp`: under `set -e` a false test is a
            # failed command and the whole build stops on the first optional
            # path that happens not to exist.
            if [ -e "$path" ]; then
              cp -R "$path" "$STAGE/"
            fi
          done

          # The framework's working directories, empty. Their contents belong
          # to the instance being upgraded and are never part of a release.
          mkdir -p "$STAGE/storage/app/private" \
                   "$STAGE/storage/framework/cache/data" \
                   "$STAGE/storage/framework/sessions" \
                   "$STAGE/storage/framework/testing" \
                   "$STAGE/storage/framework/views" \
                   "$STAGE/storage/logs"
          find "$STAGE/storage" -type d -exec touch {}/.gitkeep \;

          # Anything the build left behind that an installation must not
          # inherit: a compiled config pointing at the runner's paths, a hot
          # file pointing at a Vite server that does not exist.
          rm -f "$STAGE/bootstrap/cache/"*.php "$STAGE/public/hot"

          # The written documentation ships; the seventy screenshots of it do
          # not. They are twenty-three megabytes that every instance would
          # download on every upgrade to look at a picture of itself.
          rm -rf "$STAGE/docs/screenshots"
          rm -rf "$STAGE/public/storage"

          # What the updater checks before it installs anything.
          cat > "$STAGE/build.json" <<JSON
          {
            "product": "ticktz",
            "version": "$VERSION",
            "commit": "$GITHUB_SHA",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          cd dist
          zip -qry "ticktz-$VERSION.zip" ticktz
          sha256sum "ticktz-$VERSION.zip" | awk '{print $1}' > "ticktz-$VERSION.zip.sha256"

          echo "Built ticktz-$VERSION.zip ($(du -h "ticktz-$VERSION.zip" | cut -f1))"

      # Keyless provenance, signed by the workflow itself and recorded in a
      # public transparency log. It proves this archive came out of this
      # repository and this commit, which a checksum cannot: a checksum says
      # the bytes did not change on the way, and says nothing about where they
      # were made. Verified with `gh attestation verify`; see docs/releasing.md.
      - name: Attest where the archive came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ticktz-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: installable
          path: |
            dist/ticktz-*.zip
            dist/ticktz-*.zip.sha256
          retention-days: 7

  release:
    name: Draft the release notes
    needs: [image, bundle]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: installable
          path: dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          # The two files an in-place upgrade reads: the application, and the
          # digest it is checked against. An update screen that cannot find
          # them says so rather than installing something it did not verify.
          files: |
            dist/ticktz-*.zip
            dist/ticktz-*.zip.sha256
          # Drafted rather than published: the generated notes are a commit
          # list, and a release worth tagging is worth a paragraph written by
          # a person.
          draft: true
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
            ```

            Built for `linux/amd64` and `linux/arm64`.

            ## Upgrading in place

            Installations that run from source can upgrade from
            *Administration → Updates*, or with:

            ```
            php artisan ticktz:upgrade
            ```

            Both install `ticktz-*.zip` below after checking it against
            `ticktz-*.zip.sha256`.

            ## Upgrading

            See [docs/self-hosting.md](docs/self-hosting.md#upgrading). Take a
            backup first — `scripts/backup.sh` — and read the notes below for
            anything that needs a manual step.
