name: Release

# Tagging is the trigger, so cutting a release is one `git tag` and a push
# rather than a checklist somebody follows by hand.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, e.g. v1.0.0'
        required: true

permissions:
  contents: write # create the release and attach the archive
  packages: write # push the image to ghcr.io
  # Attestations are signed with a short-lived certificate issued to this
  # workflow rather than with a key somebody stores. These two are what let it
  # ask for one. See docs/releasing.md.
  id-token: write
  attestations: write

# The version being released, named once. On a tag push it is the tag; on a
# `workflow_dispatch` it is what was typed into the box. Every job checks out
# this ref and every tag is derived from it, so a re-run of an old release
# cannot build one version's code and label it another's.
env:
  TICKTZ_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ticktz_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TICKTZ_TAG }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, ldap, mbstring, pdo_mysql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress

      # A release is the worst moment to discover a known vulnerability, and
      # the one moment somebody will definitely be looking at the output.
      - run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ticktz_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --colors=always

      - name: The tag must match the version in the code
        # A container that reports a different version from the tag it was
        # built from is the kind of thing nobody notices until they are trying
        # to work out which build is in production.
        run: |
          TAG="$TICKTZ_TAG"
          CODE="v$(grep -oP "(?<=TICKTZ_VERSION', ')[^']+" config/ticktz.php)"
          echo "tag=${TAG} code=${CODE}"
          test "${TAG}" = "${CODE}"

  # Two jobs, one per architecture, each on a runner of that architecture.
  #
  # This used to be one job building both platforms through QEMU, and it was
  # the whole release: forty-one minutes of a forty-five minute run. Nothing
  # about it was stuck — `docker-php-ext-install` compiles a dozen extensions
  # from C, and every instruction of that compile was being emulated
  # instruction by instruction on an Intel runner.
  #
  # GitHub gives public repositories arm64 runners at no cost, so the
  # emulation was only ever buying us the convenience of a single job. Each
  # platform is now compiled by a processor that speaks its own instruction
  # set, and the two run at the same time rather than one after the other, so
  # the release costs the slower of them instead of the sum.
  #
  # They push by digest and carry no tag: an image nobody can pull by name is
  # not published, and `latest` moves exactly once, in the job below, when
  # both architectures exist. A half-published multi-arch tag — amd64 pushed,
  # arm64 still building — is the failure this shape makes impossible.
  image:
    name: Build the image (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}

    strategy:
      # Both results are wanted even when one fails: knowing that arm64 broke
      # and amd64 did not is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TICKTZ_TAG }}

      # No setup-qemu-action. That is the point of this job.
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. The tags belong to the manifest, which is the thing an
      # operator actually pulls.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: A name for this platform that a file can have
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # A cache per architecture. Sharing one scope between them means the
          # second build evicts the first's layers and neither ever hits.
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.slug }}

      # An empty file named after the digest: the manifest job needs the
      # digests and nothing else, and this is the smallest thing that carries
      # one between jobs.
      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Where the two builds become one name.
  #
  # `imagetools create` writes a manifest list pointing at both digests, which
  # is what makes `docker pull ghcr.io/…/ticktz:1.2.3` fetch the right one on
  # an Ampere VM and on an Intel server without either knowing the other
  # exists. Seconds, because nothing is rebuilt: the layers are already in the
  # registry and this only writes the index above them.
  manifest:
    name: Publish the image tags
    needs: image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3, 1.2, 1 and latest, so an operator can pin as tightly as
          # they want to. `latest` only moves for a real release.
          #
          # Each reads the tag explicitly rather than letting the action infer
          # it from `github.ref`: on a `workflow_dispatch` the ref is a branch,
          # and a semver pattern given a branch name produces no tag at all —
          # a release that publishes an image reachable only by digest.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TICKTZ_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TICKTZ_TAG }}
            type=semver,pattern={{major}},value=${{ env.TICKTZ_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TICKTZ_TAG, '-') }}

      - name: Join the two builds under one name
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

  bundle:
    name: Build the installable archive
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TICKTZ_TAG }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, ldap, mbstring, pdo_mysql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # A GitHub source archive carries neither `vendor` nor the built assets,
      # so installing one means running composer and npm on the server — with
      # network access to two package registries, at whatever version of each
      # tool happens to be installed. The archive below is the whole
      # application, ready to run, which is what makes an upgrade from the
      # browser a download and a swap rather than a build.
      - name: Install what the application ships with
        run: |
          composer install --no-dev --no-interaction --no-progress \
            --prefer-dist --optimize-autoloader
          npm ci --no-audit --no-fund
          npm run build

      - name: Assemble the tree
        run: |
          set -euo pipefail
          VERSION="${TICKTZ_TAG#v}"
          STAGE="dist/ticktz"

          mkdir -p "$STAGE"

          # Named rather than excluded. An exclude list quietly ships whatever
          # somebody adds to the repository next; this one ships what the
          # application is, and anything new has to be added on purpose.
          for path in app bootstrap config database lang public resources routes \
                      scripts vendor artisan composer.json composer.lock LICENSE \
                      README.md CHANGELOG.md docs docker; do
            # An `if`, not `[ … ] && cp`: under `set -e` a false test is a
            # failed command and the whole build stops on the first optional
            # path that happens not to exist.
            if [ -e "$path" ]; then
              cp -R "$path" "$STAGE/"
            fi
          done

          # The framework's working directories, empty. Their contents belong
          # to the instance being upgraded and are never part of a release.
          mkdir -p "$STAGE/storage/app/private" \
                   "$STAGE/storage/framework/cache/data" \
                   "$STAGE/storage/framework/sessions" \
                   "$STAGE/storage/framework/testing" \
                   "$STAGE/storage/framework/views" \
                   "$STAGE/storage/logs"
          find "$STAGE/storage" -type d -exec touch {}/.gitkeep \;

          # Anything the build left behind that an installation must not
          # inherit: a compiled config pointing at the runner's paths, a hot
          # file pointing at a Vite server that does not exist.
          rm -f "$STAGE/bootstrap/cache/"*.php "$STAGE/public/hot"

          # The written documentation ships; the seventy screenshots of it do
          # not. They are twenty-three megabytes that every instance would
          # download on every upgrade to look at a picture of itself.
          rm -rf "$STAGE/docs/screenshots"
          rm -rf "$STAGE/public/storage"

          # What the updater checks before it installs anything.
          cat > "$STAGE/build.json" <<JSON
          {
            "product": "ticktz",
            "version": "$VERSION",
            "commit": "$GITHUB_SHA",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

          cd dist
          zip -qry "ticktz-$VERSION.zip" ticktz
          sha256sum "ticktz-$VERSION.zip" | awk '{print $1}' > "ticktz-$VERSION.zip.sha256"

          echo "Built ticktz-$VERSION.zip ($(du -h "ticktz-$VERSION.zip" | cut -f1))"

      # Keyless provenance, signed by the workflow itself and recorded in a
      # public transparency log. It proves this archive came out of this
      # repository and this commit, which a checksum cannot: a checksum says
      # the bytes did not change on the way, and says nothing about where they
      # were made. Verified with `gh attestation verify`; see docs/releasing.md.
      - name: Attest where the archive came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ticktz-*.zip

      # Only to hand the archive to the next job. A day is long enough for
      # that and short enough to stay out of the storage bill: an Actions
      # artifact counts against the account's storage quota, where the release
      # asset it becomes does not.
      - uses: actions/upload-artifact@v4
        with:
          name: installable
          path: |
            dist/ticktz-*.zip
            dist/ticktz-*.zip.sha256
          retention-days: 1

  release:
    name: Draft the release notes
    needs: [manifest, bundle]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: installable
          path: dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TICKTZ_TAG }}
          generate_release_notes: true
          # The two files an in-place upgrade reads: the application, and the
          # digest it is checked against. An update screen that cannot find
          # them says so rather than installing something it did not verify.
          files: |
            dist/ticktz-*.zip
            dist/ticktz-*.zip.sha256
          # Drafted rather than published: the generated notes are a commit
          # list, and a release worth tagging is worth a paragraph written by
          # a person.
          #
          # Except on a re-run, which is how a release whose archive never
          # attached gets its archive. That release is usually already
          # published, and this action updates the existing one rather than
          # refusing — so `draft: true` there would retract a live release and
          # stop every instance seeing the update, to attach a file to it.
          # A `workflow_dispatch` is a rebuild of something that exists; a tag
          # push is a new release. Write the notes before dispatching.
          draft: ${{ github.event_name != 'workflow_dispatch' }}
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ env.TICKTZ_TAG }}
            ```

            Built for `linux/amd64` and `linux/arm64`.

            ## Upgrading in place

            Installations that run from source can upgrade from
            *Administration → Updates*, or with:

            ```
            php artisan ticktz:upgrade
            ```

            Both install `ticktz-*.zip` below after checking it against
            `ticktz-*.zip.sha256`.

            ## Upgrading

            See [docs/self-hosting.md](docs/self-hosting.md#upgrading). Take a
            backup first — `scripts/backup.sh` — and read the notes below for
            anything that needs a manual step.
