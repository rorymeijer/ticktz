name: CI

# Every commit is checked exactly once.
#
# `push: ['**']` alongside `pull_request` runs the whole suite twice for every
# commit on a branch with an open pull request — and the concurrency group
# below does not collapse them, because a push and a pull_request carry
# different `github.ref` values (`refs/heads/x` against `refs/pull/N/merge`).
# On a private repository that is double the billed minutes for no second
# opinion.
#
# The trade: a branch with no pull request open gets no CI. Open the pull
# request, which is where the result is read anyway.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ticktz_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, ldap, mbstring, pdo_mysql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: ./vendor/bin/pint --test

      - name: Shell tests
        run: |
          sh tests/Shell/place-code.test.sh
          sh tests/Shell/install.test.sh

      # The Laravel 11 advisories that forced the upgrade in D50 sat in the
      # lock file for weeks before anyone ran this by hand. Now the build
      # notices.
      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Run migrations against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ticktz_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run the test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ticktz_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --colors=always

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        # Advisory only below high: the npm tree is build-time tooling, and a
        # moderate advisory in a transitive dev dependency should not stop a
        # release of a product that ships none of it.
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx vite build

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ticktz
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # .env.example puts sessions, cache and queues on Redis, and the audit
      # signs in — without this the first request fails on the session store.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, ldap, mbstring, pdo_mysql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund

      - name: Install the browser axe drives
        run: npx playwright install --with-deps chromium

      - name: Boot a demo instance
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ticktz
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force
          php artisan ticktz:demo
          npm run build
          php artisan serve --port=8123 &
          # The audit signs in, so wait for a real response rather than a port.
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8123/login && break; sleep 1; done

      - name: Run axe over every shell
        run: npm run a11y

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Make the build context look like a developer's machine rather than a
      # clean checkout. Without this the checks below pass by accident: CI has
      # no .env and has never run the Vite dev server, so nothing would be
      # there to leak whether the image excluded it or not.
      - name: Plant the files a working checkout would have
        run: |
          printf 'APP_KEY=base64:leaked\nDB_PASSWORD=hunter2\n' > .env
          printf 'http://localhost:5173' > public/hot
          mkdir -p bootstrap/cache && printf '<?php return [];' > bootstrap/cache/config.php

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ticktz/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image carries its code at /usr/src/ticktz and the entrypoint puts
      # it into /var/www/html, which is the arrangement that lets the app and
      # the worker share a code volume. Nothing in the unit tests can prove the
      # image was assembled that way — only starting one can.
      - name: The image places its code
        run: |
          docker run --rm --entrypoint sh ticktz/app:ci -c '
            set -e
            test -f /usr/src/ticktz/artisan
            test -s /usr/local/share/ticktz/image-version
            /usr/local/bin/ticktz-place-code
            test -f /var/www/html/artisan
            test -f /var/www/html/vendor/autoload.php
            test -f /var/www/html/public/build/manifest.json
            test "$(cat /var/www/html/.ticktz-image)" = "$(cat /usr/local/share/ticktz/image-version)"
            php /var/www/html/artisan --version
          '

      # Neither the secrets nor the dev-server marker may reach the image. The
      # .env would ship a database password to anybody who pulls it, and
      # public/hot makes Laravel send every browser to localhost:5173 for its
      # JavaScript — a white page with nothing in any log to explain it.
      - name: The image carries no secrets and no dev-server marker
        run: |
          docker run --rm --entrypoint sh ticktz/app:ci -c '
            set -e
            for path in .env public/hot bootstrap/cache/config.php node_modules; do
              if [ -e "/usr/src/ticktz/$path" ]; then
                echo "LEAKED INTO THE IMAGE: $path" >&2
                exit 1
              fi
            done
            # And the placed tree inherits that, since it is a copy of it.
            /usr/local/bin/ticktz-place-code >/dev/null
            test ! -e /var/www/html/public/hot

            # /var/www/html/.env is NOT checked for absence: an instance with
            # no APP_KEY in its environment writes one there, which is the
            # point of it. What must be true is narrower and more useful —
            # the password planted in the build context appears nowhere, in
            # the image or in the tree placed from it.
            if grep -rq "hunter2" /usr/src/ticktz /var/www/html 2>/dev/null; then
                echo "THE BUILD CONTEXT SECRET REACHED THE IMAGE" >&2
                exit 1
            fi

            echo "clean"
          '

      # A volume that already holds a newer version is left alone, which is
      # what makes an upgrade installed from the browser survive a restart.
      # Getting this backwards would silently undo every web upgrade on the
      # next `docker compose up -d`.
      - name: A newer version in the volume survives a restart
        run: |
          docker volume create ticktz-ci-code
          docker run --rm -v ticktz-ci-code:/var/www/html --entrypoint sh ticktz/app:ci -c '
            /usr/local/bin/ticktz-place-code >/dev/null
            printf "99.0.0" > /var/www/html/.ticktz-image
            printf "installed from the browser" > /var/www/html/artisan
          '
          docker run --rm -v ticktz-ci-code:/var/www/html --entrypoint sh ticktz/app:ci -c '
            /usr/local/bin/ticktz-place-code
            test "$(cat /var/www/html/artisan)" = "installed from the browser"
          '
          docker volume rm ticktz-ci-code
