# ---------------------------------------------------------------------------
# Ticktz — production stack.
#
#   cp .env.example .env && edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the development stack: the app image is self-contained
# (vendor + compiled assets baked in, no bind mounts), there is no Vite dev
# server and no mail sink, and MySQL/Redis are not published on the host.
#
# The application code lives in the `code` volume, shared by the app, the
# worker and nginx, rather than in each container's own writable layer. That is
# what makes Administration → Updates work here: the worker does the upgrade,
# and the app has to be able to see what it did. A container's writable layer
# is invisible to its siblings and gone on the next `up -d`, so an upgrade
# written there would appear to succeed and silently revert.
#
# The image stays the source of truth. Its code sits at /usr/src/ticktz, and
# the entrypoint copies it into the volume whenever the image is the newer of
# the two — so `docker compose pull && up -d` still updates the code, and a
# newer version installed from the browser is left alone. See
# docker/php/entrypoint.sh.
# ---------------------------------------------------------------------------

# The production stack keeps the plain name; the development stack is
# `ticktz-dev`. They must differ: Compose identifies a stack by its name, so
# one name across both files would mean each `up` replaces the other's
# containers and volumes.
name: ticktz

x-app-base: &app-base
  build:
    context: .
    target: runtime
  image: ${TICKTZ_IMAGE:-ticktz/app:latest}
  env_file: [.env]
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - code:/var/www/html
    - storage:/var/www/html/storage
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${TICKTZ_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only, and the same volume the app serves from — so an upgrade that
      # replaces the compiled assets is visible to nginx without a restart.
      - code:/var/www/html:ro
    depends_on:
      # Healthy, not merely started. On a first boot the app container copies
      # the application into the code volume before php-fpm listens, and an
      # nginx that starts during that window answers 502 with no explanation.
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    <<: *app-base
    environment:
      CONTAINER_ROLE: app
      APP_ENV: production
      APP_DEBUG: "false"
      # Off by default so a first boot lands on the setup wizard rather than
      # migrating into a database nobody has chosen yet. Set it to true for an
      # unattended deployment that runs `ticktz:install` itself.
      TICKTZ_AUTO_MIGRATE: ${TICKTZ_AUTO_MIGRATE:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "9000"
    healthcheck:
      # php-fpm speaks FastCGI rather than HTTP, so this asks the only question
      # that can be asked from outside it: is anything accepting connections on
      # its port. That is false for the whole of the first-boot copy, which is
      # exactly the window nginx must not serve in.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  worker:
    <<: *app-base
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/ticktz.conf"]
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TICKTZ_AUTO_MIGRATE: "false"
      TICKTZ_QUEUES: ${TICKTZ_QUEUES:-high,default,mail,webhooks,low}
      TICKTZ_QUEUE_WORKERS: ${TICKTZ_QUEUE_WORKERS:-4}
      # The worker owns the code, which is what lets it replace it. The app
      # container deliberately does not set this: see UpgradePreflight.
      TICKTZ_SELF_UPGRADE: ${TICKTZ_SELF_UPGRADE:-true}

  mysql:
    # Pinned to the LTS, and to the same version the dev stack and CI run.
    # Upgrading an existing 8.0 data directory is one-way; see the upgrade
    # notes in docs/self-hosting.md before pulling this.
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ticktz}
      MYSQL_USER: ${DB_USERNAME:-ticktz}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/ticktz.cnf:/etc/mysql/conf.d/ticktz.cnf:ro
    healthcheck:
      # As in the development stack: the application's own credentials against
      # the application's own database, because a server that answers root is
      # not the same thing as a database the app can use.
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
          -e 'select 1' "$$MYSQL_DATABASE"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql:
  redis:
  storage:
  # The application's own code. Filled from the image on first boot and
  # whenever the image is newer; written by the worker during an upgrade.
  code:
