; Development overrides, layered on top of 99-ticktz.ini.
;
; Mounted only by docker-compose.yml, and named so it sorts after the
; production file in conf.d — the last definition of a setting wins.

; The one that matters.
;
; The production ini sets opcache.validate_timestamps = 0, which is right for a
; deploy that replaces an image and restarts php-fpm: PHP reads each file once
; and never looks at it again, which is most of what opcache is for.
;
; In the development stack the source tree is a bind mount, and that same
; setting means every edit and every `git pull` is invisible until the
; container is restarted. The symptoms do not point at it: a route added five
; minutes ago returns 404 while `artisan route:list` — running under the CLI,
; where opcache is off — lists it happily. A config value stays at its old
; number, so anything keyed on it keeps serving what it cached.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; JIT buys nothing on a request that runs once and gains a warm-up cost on
; every one of them. Off here, on in production.
opcache.jit = disable

; A development stack is for finding out what went wrong.
display_errors = On
display_startup_errors = On
