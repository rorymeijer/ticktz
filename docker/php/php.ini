; Ticktz PHP runtime defaults. Override per-deployment with your own ini file.
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Timestamps are checked, and the JIT is off. Both were the other way round,
; and together they segfaulted php-fpm.
;
; `validate_timestamps = 0` is the usual production advice, and it is wrong for
; this application specifically. Ticktz replaces its own code: the update screen
; swaps the whole tree under a running php-fpm. Worse, it is the *worker*
; container that does the swapping, and opcache is per-process — the app
; container cannot be told to forget what it compiled, because nothing in the
; worker can reach it. So the app went on serving scripts it had compiled from
; files that no longer existed.
;
; With `jit = tracing` on top of that, the traces were machine code compiled
; against the old scripts. That is a segfault, and it is the one behind
; `child N exited on signal 11 (SIGSEGV)` after an upgrade, the 502s that
; followed it, and the fact that restarting the container appeared to fix it:
; opcache lives in shared memory, so a fresh worker inherited the same bad
; state and crashed too, and only tearing the container down cleared it.
;
; The JIT is off rather than merely reconciled with the timestamps, because it
; was never the right trade here. It pays off in tight numeric loops; a service
; desk spends its time waiting on MySQL and Redis, where the JIT buys close to
; nothing and costs a class of crash that is very hard to read from a log.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = off
opcache.jit_buffer_size = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
