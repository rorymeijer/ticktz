[www]
; php-fpm pool sizing for a single Ticktz app container. Scale horizontally by
; running more app containers rather than growing a single pool too far.
pm = dynamic
pm.max_children = 40
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
pm.status_path = /fpm-status

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
