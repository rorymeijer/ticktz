; Runs the Ticktz background workers: the queue consumer (SLA timers,
; automation actions, mail, webhooks) and the Laravel scheduler.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:queue]
command=php /var/www/html/artisan queue:work redis --queue=%(ENV_TICKTZ_QUEUES)s --sleep=1 --tries=3 --max-time=3600 --backoff=5
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=%(ENV_TICKTZ_QUEUE_WORKERS)s
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
