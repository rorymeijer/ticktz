# ---------------------------------------------------------------------------
# Ticktz — development stack.
#
#   docker compose up -d
#
# Serves the app on http://localhost:8080 with hot-reloading Vite assets,
# a GreenMail inbox on http://localhost:8025 and a MySQL 8 database.
# For production use docker-compose.prod.yml instead.
# ---------------------------------------------------------------------------

name: ticktz

x-app-base: &app-base
  build:
    context: .
    target: runtime
  image: ticktz/app:dev
  env_file: [.env]
  environment:
    APP_ENV: ${APP_ENV:-local}
    # The development stack is for looking at, so it arrives populated: a
    # `docker compose up` on a fresh clone that lands on an empty database with
    # no accounts is not something anybody can evaluate. Only ever seeds when
    # the instance has no users, and never in production — see the entrypoint.
    TICKTZ_SEED_DEMO: ${TICKTZ_SEED_DEMO:-true}
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${TICKTZ_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  app:
    <<: *app-base
    environment:
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "9000"

  worker:
    <<: *app-base
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/ticktz.conf"]
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TICKTZ_QUEUES: ${TICKTZ_QUEUES:-high,default,mail,webhooks,low}
      TICKTZ_QUEUE_WORKERS: ${TICKTZ_QUEUE_WORKERS:-2}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      app: { condition: service_started }

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${TICKTZ_VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      # What the container binds…
      VITE_PORT: 5173
      # …and what the browser has to ask for, which is the published port on
      # the host. The two differ the moment a second checkout publishes 5174 to
      # keep out of this one's way, and the URL written into public/hot is the
      # browser's, not the container's.
      VITE_BROWSER_PORT: ${TICKTZ_VITE_PORT:-5173}
      VITE_BROWSER_HOST: ${TICKTZ_VITE_HOST:-localhost}
    restart: unless-stopped

  mysql:
    # 8.4 is the current LTS; 8.0 left support in April 2026. Kept identical to
    # the production stack on purpose — a dev database on a different major
    # version is a bug report waiting to be filed against the wrong thing.
    #
    # No `command:` overrides. `--mysql-native-password=OFF` used to be here,
    # which is an 8.4 option that 8.0 refuses to start with; the server aborts
    # on an unknown variable, so the container never came up at all. 8.4
    # already defaults to caching_sha2_password, so there is nothing to set.
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ticktz}
      MYSQL_USER: ${DB_USERNAME:-ticktz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/ticktz.cnf:/etc/mysql/conf.d/ticktz.cnf:ro
    ports:
      - "${TICKTZ_MYSQL_PORT:-3306}:3306"
    healthcheck:
      # Checks what the application needs, not merely that a server answers.
      #
      # `mysqladmin ping` as root says the process is up, and it says that
      # just as cheerfully when the data directory was initialised without the
      # application's user and database — which is what a leftover volume
      # gives you. The dependency gate then opens, the app starts, and the
      # first query fails with "Host … is not allowed to connect to this MySQL
      # server", a long way from the cause.
      #
      # So: connect as the user the app connects as, to the database the app
      # uses. `$$` escapes the compose interpolation so the shell inside the
      # container expands them.
      test:
        - CMD-SHELL
        - >-
          mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
          -e 'select 1' "$$MYSQL_DATABASE"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Development mail server. GreenMail rather than MailHog because Ticktz
  # needs both halves of the conversation: SMTP to catch what goes out (3025)
  # and IMAP to read it back in (3143), which is how the email-to-ticket
  # poller can be exercised without an external mailbox. Authentication is
  # disabled and mailboxes are created on first use, so any address works.
  mail:
    image: greenmail/standalone:2.1.0
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.users.login=email
    ports:
      - "${TICKTZ_MAIL_SMTP_PORT:-3025}:3025"
      - "${TICKTZ_MAIL_IMAP_PORT:-3143}:3143"
      - "${TICKTZ_MAIL_UI_PORT:-8025}:8080"
    restart: unless-stopped

volumes:
  mysql:
  redis:
  vendor:
  node_modules:
