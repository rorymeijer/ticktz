# ---------------------------------------------------------------------------
# Ticktz — development stack.
#
#   docker compose up -d
#
# Serves the app on http://localhost:8080 with hot-reloading Vite assets,
# a MailHog inbox on http://localhost:8025 and a MySQL 8 database.
# For production use docker-compose.prod.yml instead.
# ---------------------------------------------------------------------------

name: ticktz

x-app-base: &app-base
  build:
    context: .
    target: runtime
  image: ticktz/app:dev
  env_file: [.env]
  environment:
    APP_ENV: ${APP_ENV:-local}
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    REDIS_PORT: 6379
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${TICKTZ_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  app:
    <<: *app-base
    environment:
      CONTAINER_ROLE: app
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "9000"

  worker:
    <<: *app-base
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/ticktz.conf"]
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TICKTZ_QUEUES: ${TICKTZ_QUEUES:-high,default,mail,webhooks,low}
      TICKTZ_QUEUE_WORKERS: ${TICKTZ_QUEUE_WORKERS:-2}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      app: { condition: service_started }

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${TICKTZ_VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      VITE_PORT: 5173
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --mysql-native-password=OFF
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ticktz}
      MYSQL_USER: ${DB_USERNAME:-ticktz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/ticktz.cnf:/etc/mysql/conf.d/ticktz.cnf:ro
    ports:
      - "${TICKTZ_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Development mail sink. Catches every outgoing Mailable and exposes an
  # IMAP server the email-to-ticket poller can read back (port 1143).
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${TICKTZ_MAILHOG_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mysql:
  redis:
  vendor:
  node_modules:
